ass="oculto"><h1>Xadrez de Schrödinger Quântico</h1><div id="status">Turno das Brancas</div><div id="placar" class="placar"></div><div id="relogios" class="relogios oculto"><div id="relogioBrancas" class="relogio">Brancas<strong>--:--</strong></div><div id="relogioPretas" class="relogio">Pretas<strong>--:--</strong></div></div><div class="container"><div id="tabuleiro"></div><div class="painel-lateral"><div class="painel-titulo">Histórico de Lances</div><div id="historico" class="historico-lista"></div><div id="didatica" class="historico-lista"></div><button id="btnDesfazer" class="btn-desfazer" onclick="desfazerJogada()" disabled>Desfazer Jogada</button></div></div><button id="btnVoltarConfiguracao" class="btn-principal btn-secundario">Voltar à configuração</button></section><script>const chess = new Chess(); const nomesPecas = { p: 'Peão', n: 'Cavalo', b: 'Bispo', r: 'Torre', q: 'Dama', k: 'Rei' }; const colunas = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h']; const svgPecas = { w: { p: 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg', n: 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg', b: 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg', r: 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg', q: 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg', k: 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg' }, b: { p: 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg', n: 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg', b: 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg', r: 'https://commons.wikimedia.org/wiki/Special:FilePath/Chess_rdt45.svg', q: 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg', k: 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg' } }; let pecasQuanticas = {}; let casaSelecionada = null; let historicoEstadosQuanticos = []; let configuracaoPartida = null; let relogioPartida = { ativo: false, ultimoInstante: 0, intervalId: null, segundos: { w: 0, b: 0 }, incremento: 0 }; let placarTorneio = { w: 0, b: 0, empates: 0, partida: 1 }; let partidaEncerrada = false; function inicializarPecasQuanticas() { pecasQuanticas = {}; if (configuracaoPartida?.modo === 'classico') { for (const coluna of colunas) { pecasQuanticas[`${coluna}2`] = { possibilidades: ['p'], cor: 'w', colapsada: 'p', emaranhadaComId: null }; pecasQuanticas[`${coluna}7`] = { possibilidades: ['p'], cor: 'b', colapsada: 'p', emaranhadaComId: null }; } const pecas = { a: 'r', b: 'n', c: 'b', d: 'q', e: 'k', f: 'b', g: 'n', h: 'r' }; for (const coluna of colunas) { pecasQuanticas[`${coluna}1`] = { possibilidades: [pecas[coluna]], cor: 'w', colapsada: pecas[coluna], emaranhadaComId: null }; pecasQuanticas[`${coluna}8`] = { possibilidades: [pecas[coluna]], cor: 'b', colapsada: pecas[coluna], emaranhadaComId: null }; } return; } const grupos = [ [['b1', 'c1'], ['n', 'b']], [['f1', 'g1'], ['n', 'b']], [['a1', 'd1'], ['r', 'q']], [['h1'], ['r', 'q']], [['e1'], ['k']], [['b8', 'c8'], ['n', 'b']], [['f8', 'g8'], ['n', 'b']], [['a8', 'd8'], ['r', 'q']], [['h8'], ['r', 'q']], [['e8'], ['k']] ]; let grupoId = 1; for (const [casas, possibilidades] of grupos) { for (const casa of casas) { const cor = Number(casa[1]) <= 2 ? 'w' : 'b'; pecasQuanticas[casa] = { possibilidades: [...possibilidades], cor, colapsada: possibilidades.length === 1 ? possibilidades[0] : null, emaranhadaComId: casas.length > 1 ? grupoId : null }; } if (casas.length > 1) grupoId++; } for (let coluna of colunas) { pecasQuanticas[`${coluna}2`] = { possibilidades: ['p'], cor: 'w', colapsada: 'p', emaranhadaComId: null }; pecasQuanticas[`${coluna}7`] = { possibilidades: ['p'], cor: 'b', colapsada: 'p', emaranhadaComId: null }; } } function salvarEstadoQuantico() { historicoEstadosQuanticos.push(JSON.parse(JSON.stringify(pecasQuanticas))); } function criarImagem(cor, tipo) { const imagem = document.createElement('img'); imagem.src = svgPecas[cor][tipo]; imagem.className = 'peca-img'; imagem.alt = nomesPecas[tipo]; return imagem; } function renderizarTabuleiro() { const tabuleiro = document.getElementById('tabuleiro'); tabuleiro.innerHTML = ''; for (let linha = 8; linha >= 1; linha--) { for (let coluna = 0; coluna < 8; coluna++) { const casa = `${colunas[coluna]}${linha}`; const elemento = document.createElement('div'); elemento.className = `casa ${(linha + coluna) % 2 !== 0 ? 'clara' : 'escura'}`; elemento.dataset.casa = casa; if (casaSelecionada === casa) elemento.classList.add('selecionada'); elemento.addEventListener('click', () => clicarCasa(casa)); elemento.addEventListener('dragover', evento => { evento.preventDefault(); elemento.classList.add('drag-over'); }); elemento.addEventListener('dragleave', () => elemento.classList.remove('drag-over')); elemento.addEventListener('drop', evento => { evento.preventDefault(); elemento.classList.remove('drag-over'); executarMovimento(evento.dataTransfer.getData('text/plain'), casa); }); const pecaQ = pecasQuanticas[casa]; if (pecaQ && chess.get(casa)) { const recipiente = document.createElement('div'); recipiente.className = 'peca-container'; recipiente.draggable = pecaQ.cor === chess.turn(); if (pecaQ.emaranhadaComId && !pecaQ.colapsada) recipiente.classList.add('emaranhada'); recipiente.addEventListener('dragstart', evento => { casaSelecionada = casa; evento.dataTransfer.setData('text/plain', casa); }); recipiente.addEventListener('dragend', () => { casaSelecionada = null; renderizarTabuleiro(); }); if (pecaQ.colapsada) recipiente.appendChild(criarImagem(pecaQ.cor, pecaQ.colapsada)); else { const superposicao = document.createElement('div'); superposicao.className = 'quantica-split'; pecaQ.possibilidades.forEach(tipo => superposicao.appendChild(criarImagem(pecaQ.cor, tipo))); recipiente.appendChild(superposicao); } elemento.appendChild(recipiente); } tabuleiro.appendChild(elemento); } } atualizarStatusEHistorial(); } function clicarCasa(casa) { if (configuracaoPartida?.oponente === 'ia' && chess.turn() === 'b') return; const peca = chess.get(casa); if (casaSelecionada === null) { if (peca && peca.color === chess.turn()) { casaSelecionada = casa; renderizarTabuleiro(); } } else { const origem = casaSelecionada; casaSelecionada = null; if (origem === casa) renderizarTabuleiro(); else executarMovimento(origem, casa); } } function executarMovimento(origem, destino) { const pecaQ = pecasQuanticas[origem]; if (!pecaQ) return renderizarTabuleiro(); let tipoEscolhido = null; for (const possibilidade of pecaQ.possibilidades) { chess.put({ type: possibilidade, color: pecaQ.cor }, origem); if (chess.move({ from: origem, to: destino, promotion: 'q' })) { tipoEscolhido = possibilidade; chess.undo(); break; } chess.remove(origem); } if (!tipoEscolhido) { chess.put({ type: pecaQ.colapsada || pecaQ.possibilidades[0], color: pecaQ.cor }, origem); alert('❌ Movimento inválido quânticamente!'); return renderizarTabuleiro(); } salvarEstadoQuantico(); let mensagem = ''; if (!pecaQ.colapsada && pecaQ.possibilidades.length > 1) { pecaQ.colapsada = tipoEscolhido; pecaQ.possibilidades = [tipoEscolhido]; mensagem = `🔮 Colapso! A peça em ${destino} revelou-se um: ${nomesPecas[tipoEscolhido]}.`; if (pecaQ.emaranhadaComId) { for (const casa of Object.keys(pecasQuanticas)) { const par = pecasQuanticas[casa]; if (casa !== origem && par.emaranhadaComId === pecaQ.emaranhadaComId && !par.colapsada) { const oposta = par.possibilidades.find(tipo => tipo !== tipoEscolhido); if (oposta) { par.colapsada = oposta; par.possibilidades = [oposta]; mensagem += `\n⛓️ O par em ${casa} colapsou para: ${nomesPecas[oposta]}!`; } } } } } chess.put({ type: tipoEscolhido, color: pecaQ.cor }, origem); chess.move({ from: origem, to: destino, promotion: 'q' }); pecasQuanticas[destino] = pecaQ; delete pecasQuanticas[origem]; iniciarRelogioSeNecessario(); relogioPartida.segundos[pecaQ.cor] += relogioPartida.incremento; atualizarRelogios(); renderizarTabuleiro(); if (mensagem) alert(mensagem); if (chess.game_over()) { const vencedor = chess.in_checkmate() ? (chess.turn() === 'w' ? 'b' : 'w') : null; registrarResultado(vencedor, chess.in_checkmate() ? 'xeque-mate' : 'empate'); } else agendarLanceDaIA(); } function desfazerJogada() { if (!historicoEstadosQuanticos.length) return; chess.undo(); pecasQuanticas = historicoEstadosQuanticos.pop(); renderizarTabuleiro(); } function atualizarStatusEHistorial() { const status = document.getElementById('status'); status.innerText = chess.in_checkmate() ? 'Fim de Jogo: Xeque-Mate!' : chess.in_draw() ? 'Fim de Jogo: Empate!' : `Turno das ${chess.turn() === 'w' ? 'Brancas' : 'Pretas'}`; const historico = document.getElementById('historico'); historico.innerHTML = ''; chess.history().forEach((lance, indice) => { if (indice % 2 === 0) { const linha = document.createElement('div'); linha.className = 'jogada-linha'; linha.innerHTML = `<span class="jogada-num">${Math.floor(indice / 2) + 1}.</span><span class="jogada-lance">${lance}</span><span class="jogada-lance">${chess.history()[indice + 1] || ''}</span>`; historico.appendChild(linha); } }); const abertura = { 'e4 e5': 'Abertura do Jogo Italiano: desenvolvimento rápido e disputa pelo centro.', 'e4 c5': 'Defesa Siciliana: as Pretas respondem de forma assimétrica ao peão do rei.', 'e4 e6': 'Defesa Francesa: estrutura sólida e pressão sobre o centro branco.', 'd4 d5': 'Jogo de Dama: luta central mais estratégica e posicional.', 'd4 Cf6': 'Defesa Índia: as Pretas desenvolvem o cavalo antes de definir o centro.' }; const sequencia = chess.history().slice(0, 2).join(' '); document.getElementById('didatica').textContent = abertura[sequencia] || (sequencia ? 'Estude desenvolvimento, controle do centro e segurança do rei.' : 'Aberturas e padrões táticos aparecerão aqui.'); document.getElementById('btnDesfazer').disabled = historicoEstadosQuanticos.length === 0; } function formatarTempo(segundos) { const total = Math.ceil(Math.max(0, segundos)); const minutos = Math.floor(total / 60); const restantes = total % 60; return `${String(minutos).padStart(2, '0')}:${String(restantes).padStart(2, '0')}`; } function atualizarRelogios() { for (const cor of ['w', 'b']) { const id = cor === 'w' ? 'relogioBrancas' : 'relogioPretas'; document.querySelector(`#${id} strong`).textContent = formatarTempo(relogioPartida.segundos[cor]); } } function configurarRelogio() { const presets = { 'sem-relogio': [0, 0], bullet: [60, 0], blitz: [180, 0], 'blitz-fischer': [180, 2], rapida: [600, 5], classica: [1800, 10] }; const escolha = configuracaoPartida.relogio; const preset = presets[escolha] || [Number(document.getElementById('configMinutos').value) * 60, Number(document.getElementById('configIncremento').value)]; relogioPartida = { ativo: false, ultimoInstante: 0, intervalId: null, segundos: { w: preset[0], b: preset[0] }, incremento: preset[1] }; document.getElementById('relogios').classList.toggle('oculto', preset[0] === 0); atualizarRelogios(); } function iniciarRelogioSeNecessario() { if (relogioPartida.ativo || relogioPartida.segundos.w === 0) return; relogioPartida.ativo = true; relogioPartida.ultimoInstante = performance.now(); relogioPartida.intervalId = setInterval(atualizarRelogio, 100); } function atualizarRelogio() { if (!relogioPartida.ativo) return; const agora = performance.now(); const decorrido = (agora - relogioPartida.ultimoInstante) / 1000; relogioPartida.ultimoInstante = agora; const cor = chess.turn(); relogioPartida.segundos[cor] -= decorrido; atualizarRelogios(); if (relogioPartida.segundos[cor] <= 0) finalizarPartida(cor === 'w' ? 'b' : 'w', 'tempo'); } function finalizarPartida(vencedor, motivo) { if (partidaEncerrada) return; if (!relogioPartida.ativo && motivo === 'tempo') return; relogioPartida.ativo = false; if (relogioPartida.intervalId) clearInterval(relogioPartida.intervalId); const texto = motivo === 'tempo' ? `Tempo esgotado. ${vencedor === 'w' ? 'Brancas' : 'Pr
