<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xadrez Quântico · Xadrez de Schrödinger</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<section class="tela-inicial" id="telaInicial">
  <h2>Nova partida</h2>
  <p class="subtitulo">Configuração padrão: partida rápida contra a IA, sem relógio.</p>
  <div class="config-grid">
    <label>
      Modo
      <select id="configModo">
        <option value="quantico" selected>Quântico</option>
        <option value="classico">Clássico</option>
      </select>
    </label>
    <label>
      Oponente
      <select id="configOponente">
        <option value="ia" selected>Adversário automatizado</option>
        <option value="humano">Dois jogadores</option>
      </select>
    </label>
    <label>
      Nível da IA
      <select id="configNivel">
        <option value="facil" selected>Fácil</option>
        <option value="medio">Médio</option>
        <option value="dificil">Difícil</option>
      </select>
    </label>
    <label>
      Modalidade
      <select id="configRelogio">
        <option value="sem-relogio" selected>Sem relógio</option>
        <option value="bullet">Bullet · 1+0</option>
        <option value="blitz">Blitz · 3+0</option>
        <option value="blitz-fischer">Blitz Fischer · 3+2</option>
        <option value="rapida">Rápida · 10+5</option>
        <option value="classica">Clássica · 30+10</option>
        <option value="personalizada">Personalizada</option>
      </select>
    </label>
    <label class="oculto" id="tempoPersonalizado">
      Minutos iniciais
      <input id="configMinutos" max="180" min="1" type="number" value="10"/>
    </label>
    <label class="oculto" id="incrementoPersonalizado">
      Incremento por lance (segundos)
      <input id="configIncremento" max="60" min="0" type="number" value="5"/>
    </label>
    <label>
      Formato
      <select id="configFormato">
        <option value="partida" selected>Partida única</option>
        <option value="melhor-de-tres">Melhor de três</option>
      </select>
    </label>
    <label>
      Quem começa
      <select id="configInicio">
        <option value="brancas" selected>Você joga com as Brancas</option>
        <option value="sorteio">Sorteio</option>
        <option value="pretas">Você joga com as Pretas</option>
      </select>
    </label>
  </div>
  <button class="btn-principal" id="btnComecar">Começar partida</button>
</section>
<section class="oculto" id="areaJogo">
  <div class="jogo-cabecalho">
    <h1>Xadrez de Schrödinger</h1>
    <div class="placar" id="placar"></div>
  </div>
  <div class="container">
    <div class="tabuleiro-area" id="tabuleiroArea">
      <div id="status" class="barra-status">
        <div id="statusTurno" class="status-turno"><span class="indicador-vez"></span><span id="textoTurno">Vez das Brancas</span></div>
        <div id="statusAlerta" class="status-alerta"></div>
      </div>
      <div id="tabuleiro"></div>
      <div class="avisos" id="avisos"></div>
    </div>
    <div class="coluna-lateral">
      <div class="relogios oculto" id="relogios">
        <div class="relogio" id="relogioBrancas">Brancas<strong>--:--</strong></div>
        <div class="relogio" id="relogioPretas">Pretas<strong>--:--</strong></div>
      </div>
      <div class="painel-lateral">
        <div class="painel-topo">
          <span class="painel-titulo">Lances</span>
          <div class="painel-nav">
            <button class="btn-nav" disabled id="btnDesfazer" onclick="desfazerJogada()" title="Desfazer lance (↺)" aria-label="Desfazer">↺</button>
            <button class="btn-nav" disabled id="btnRefazer" onclick="refazerJogada()" title="Refazer lance (↻)" aria-label="Refazer">↻</button>
          </div>
        </div>
        <div class="historico-lista" id="historico"></div>
        <div class="painel-subtitulo">Dica de Estudo</div>
        <div class="historico-lista" id="didatica"></div>
      </div>
      <button class="btn-principal btn-secundario" id="btnVoltarConfiguracao">Voltar à configuração</button>
    </div>
  </div>
</section>
<script src="script.js"></script>
</body>
</html>
