<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xadrez Quântico</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>
    <main>
        <section id="telaInicial" class="painel configuracao">
            <h1>Xadrez Quântico</h1>
            <h2>Nova partida</h2>
            <label>Modo
                <select id="configModo"><option value="quantico">Quântico</option><option value="classico">Clássico</option></select>
            </label>
            <label>Oponente
                <select id="configOponente"><option value="humano">Dois jogadores</option><option value="ia">Adversário automatizado</option></select>
            </label>
            <label>Relógio
                <select id="configRelogio"><option value="sem-relogio">Sem relógio</option><option value="bullet">Bullet · 1+0</option><option value="blitz">Blitz · 3+0</option><option value="rapida">Rápida · 10+5</option></select>
            </label>
            <button id="btnComecar">Começar partida</button>
        </section>

        <section id="areaJogo" class="oculto">
            <h1>Xadrez Quântico</h1>
            <p id="status">Turno das Brancas</p>
            <div id="relogios" class="relogios oculto"><strong id="relogioBrancas">--:--</strong><strong id="relogioPretas">--:--</strong></div>
            <div class="layout">
                <div id="tabuleiro" aria-label="Tabuleiro de xadrez"></div>
                <aside class="painel">
                    <h2>Histórico</h2>
                    <div id="historico"></div>
                    <button id="btnDesfazer" disabled>Desfazer</button>
                    <button id="btnVoltar" class="secundario">Voltar</button>
                </aside>
            </div>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
