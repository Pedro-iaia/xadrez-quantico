<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xadrez de Schrödinger Quântico v2</title>
    <!-- Importando chess.js para validação de regras clássicas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 { margin-top: 0; margin-bottom: 5px; color: #f0d9b5; }
        #status { margin-bottom: 20px; font-size: 1.1rem; color: #b58863; height: 24px; font-weight: bold; }
        
        /* Container principal para alinhar tabuleiro e painel lateral */
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #tabuleiro {
            display: grid;
            grid-template-columns: repeat(8, 70px);
            grid-template-rows: repeat(8, 70px);
            border: 4px solid #333;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .casa {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: bold;
            user-select: none;
            transition: background-color 0.2s;
            position: relative;
        }
        .clara { background-color: #f0d9b5; color: #b58863; }
        .escura { background-color: #b58863; color: #f0d9b5; }
        
        /* Destaques visuais */
        .casa.selecionada { background-color: #ffeb3b !important; color: #333 !important; }
        .casa.drag-over { box-shadow: inset 0 0 12px 3px #ffeb3b; }

        .peca-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
        }
        .peca-container:active { cursor: grabbing; }

        .peca-texto { font-size: 1.3rem; font-weight: 900; margin-bottom: 2px; }
        .sub-texto { font-size: 0.65rem; opacity: 0.85; font-family: monospace; }
        
        /* Cores das peças */
        .p-branca { color: #ffffff; text-shadow: 0 0 3px #000, 1px 1px 0 #000; }
        .p-preta { color: #111111; text-shadow: 0 0 2px #fff; }

        /* Painel Lateral do Histórico */
        .painel-lateral {
            width: 220px;
            background-color: #2a2a35;
            border: 2px solid #444;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .painel-titulo {
            background-color: #3a3a45;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid #555;
            color: #f0d9b5;
        }
        .historico-lista {
            padding: 10px;
            overflow-y: auto;
            flex-grow: 1;
            max-height: 500px;
            font-family: monospace;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .jogada-linha {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px solid #333;
        }
        .jogada-num { color: #888; width: 30px; }
        .jogada-lance { flex-grow: 1; text-align: left; padding-left: 10px; }
    </style>
</head>
<body>

    <h1>Xadrez de Schrödinger Quântico</h1>
    <div id="status">Turno das Brancas</div>

    <div class="container">
        <!-- Tabuleiro de Xadrez -->
        <div id="tabuleiro"></div>

        <!-- Histórico de Jogadas -->
        <div class="painel-lateral">
            <div class="painel-titulo">Histórico de Lances</div>
            <div id="historico" class="historico-lista">
                <!-- Preenchido via JS -->
            </div>
        </div>
    </div>

<script>
    // Inicializa o motor clássico chess.js
    const chess = new Chess();
    
    const nomesPecas = { 'p': 'Peão', 'n': 'Cavalo', 'b': 'Bispo', 'r': 'Torre', 'q': 'Dama', 'k': 'Rei' };

    // Estado Quântico
    let pecasQuanticas = {};
    let casaSelecionada = null;
    const colunas = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

    function inicializarPecasQuanticas() {
        const configuracaoInicial = {
            // Brancas
            'b1': ['n', 'b'], 'c1': ['n', 'b'], 'f1': ['n', 'b'], 'g1': ['n', 'b'],
            'a1': ['r', 'q'], 'd1': ['r', 'q'], 'e1': ['k'], 'h1': ['r', 'q'],
            // Pretas
            'b8': ['n', 'b'], 'c8': ['n', 'b'], 'f8': ['n', 'b'], 'g8': ['n', 'b'],
            'a8': ['r', 'q'], 'd8': ['r', 'q'], 'e8': ['k'], 'h8': ['r', 'q']
        };

        for(let i = 0; i < 8; i++) {
            configuracaoInicial[colunas[i] + '2'] = ['p'];
            configuracaoInicial[colunas[i] + '7'] = ['p'];
        }

        for (let casa in configuracaoInicial) {
            let linha = parseInt(casa.substring(1));
            let cor = (linha <= 2) ? 'w' : 'b';
            pecasQuanticas[casa] = {
                possibilidades: configuracaoInicial[casa],
                cor: cor,
                colapsada: configuracaoInicial[casa].length === 1 ? configuracaoInicial[casa][0] : null
            };
        }
    }

    function renderizarTabuleiro() {
        const divTabuleiro = document.getElementById('tabuleiro');
        divTabuleiro.innerHTML = '';

        for (let r = 8; r >= 1; r--) {
            for (let c = 0; c < 8; c++) {
                const casaStr = colunas[c] + r;
                const pecaClassica = chess.get(casaStr);
                const pecaQ = pecasQuanticas[casaStr];

                const casaElemento = document.createElement('div');
                casaElemento.className = `casa ${(r + c) % 2 !== 0 ? 'clara' : 'escura'}`;
                casaElemento.dataset.casa = casaStr;

                if (casaSelecionada === casaStr) {
                    casaElemento.classList.add('selecionada');
                }

                // Configuração dos Eventos do Drag and Drop na Casa de Destino
                casaElemento.addEventListener('dragover', (e) => {
                    e.preventDefault(); 
                    casaElemento.classList.add('drag-over');
                });
                casaElemento.addEventListener('dragleave', () => casaElemento.classList.remove('drag-over'));
                casaElemento.addEventListener('drop', (e) => {
                    e.preventDefault();
                    casaElemento.classList.remove('drag-over');
                    const origem = e.dataTransfer.getData('text/plain');
                    executarMovimento(origem, casaStr);
                });

                // Se houver peça válida ativa
                if (pecaQ && pecaClassica) {
                    const pecaContainer = document.createElement('div');
                    pecaContainer.className = 'peca-container';
                    pecaContainer.setAttribute('draggable', pecaQ.cor === chess.turn());
                    
                    // Eventos do Drag na Peça de Origem
                    pecaContainer.addEventListener('dragstart', (e) => {
                        casaSelecionada = casaStr;
                        e.dataTransfer.setData('text/plain', casaStr);
                    });
                    pecaContainer.addEventListener('dragend', () => {
                        casaSelecionada = null;
                        renderizarTabuleiro();
                    });

                    const classeCor = pecaQ.cor === 'w' ? 'p-branca' : 'p-preta';
                    const spanTexto = document.createElement('span');
                    spanTexto.className = `peca-texto ${classeCor}`;
                    
                    const spanSub = document.createElement('span');
                    spanSub.className = 'sub-texto';

                    if (pecaQ.colapsada) {
                        spanTexto.innerText = pecaQ.colapsada.toUpperCase();
                        spanSub.innerText = nomesPecas[pecaQ.colapsada];
                    } else {
                        spanTexto.innerText = "?";
                        spanSub.innerText = pecaQ.possibilidades.map(p => p.toUpperCase()).join('/');
                    }

                    pecaContainer.appendChild(spanTexto);
                    pecaContainer.appendChild(spanSub);
                    casaElemento.appendChild(pecaContainer);
                } else {
                    if (pecasQuanticas[casaStr]) delete pecasQuanticas[casaStr];
                }

                // Mantém suporte para clique clássico alternativo
                casaElemento.onclick = () => clicarCasa(casaStr);
                divTabuleiro.appendChild(casaElemento);
            }
        }

        atualizarStatusEHistorial();
    }

    function clicarCasa(casaStr) {
        const pecaClassica = chess.get(casaStr);
        if (casaSelecionada === null) {
            if (pecaClassica && pecaClassica.color === chess.turn()) {
                casaSelecionada = casaStr;
                renderizarTabuleiro();
            }
        } else {
            const origem = casaSelecionada;
            casaSelecionada = null;
            if (origem !== casaStr) {
                executarMovimento(origem, casaStr);
            } else {
                renderizarTabuleiro();
            }
        }
    }

    function executarMovimento(origem, destino) {
        const pecaQ = pecasQuanticas[origem];
if (!pecaQ) { renderizarTabuleiro(); return; }
let movimentoValido = false;
let tipoColapsadoNecessario = null;
// Validação Quântica de Movimentos
for (let possibilidade of pecaQ.possibilidades) {
    chess.put({ type: possibilidade, color: pecaQ.cor }, origem);
    let move = chess.move({ from: origem, to: destino, promotion: 'q' });
    if (move !== null) {
        movimentoValido = true;
        tipoColapsadoNecessario = possibilidade;
        chess.undo();
        break;
    } else {
        chess.remove(origem);
    }
}
if (movimentoValido) {
    let colapsouAgora = false;
    if (!pecaQ.colapsada && pecaQ.possibilidades.length > 1) {
        pecaQ.colapsada = tipoColapsadoNecessario;
        pecaQ.possibilidades = [tipoColapsadoNecessario];
        colapsouAgora = true;
    }
    chess.put({ type: tipoColapsadoNecessario, color: pecaQ.cor }, origem);
    chess.move({ from: origem, to: destino, promotion: 'q' });
    pecasQuanticas[destino] = pecaQ;
    delete pecasQuanticas[origem];
    if (colapsouAgora) {
        setTimeout(() => {
            // Exibe alerta de colapso quântico
            alert(`🔮 Colapso Quântico! A peça em ${destino} revelou-se um: ${nomesPecas[tipoColapsadoNecessario]}`);
        }, 50);
    }
} else {
    chess.put({ type: pecaQ.colapsada || pecaQ.possibilidades[0], color: pecaQ.cor }, origem);
    setTimeout(() => { alert("❌ Movimento inválido quânticamente!"); }, 50);
}
renderizarTabuleiro();
}
function atualizarStatusEHistorial() {
    // Atualiza cabeçalho informativo superior
    const statusDiv = document.getElementById('status');
    if (chess.in_checkmate()) statusDiv.innerText = "Fim de Jogo: Xeque-Mate!";
    else if (chess.in_draw()) statusDiv.innerText = "Fim de Jogo: Empate!";
    else statusDiv.innerText = `Turno das ${chess.turn() === 'w' ? 'Brancas' : 'Pretas'}`;
    // Reconstrói a lista lateral de histórico estruturado
    const divHistorico = document.getElementById('historico');
    divHistorico.innerHTML = '';
    const historicoLances = chess.history();
    for (let i = 0; i < historicoLances.length; i += 2) {
        const linha = document.createElement('div');
        linha.className = 'jogada-linha';
        const num = document.createElement('span');
        num.className = 'jogada-num';
        num.innerText = `${Math.floor(i / 2) + 1}.`;
        const lanceB = document.createElement('span');
        lanceB.className = 'jogada-lance';
        lanceB.innerText = historicoLances[i];
        const lanceP = document.createElement('span');
        lanceP.className = 'jogada-lance';
        lanceP.innerText = historicoLances[i+1] ? historicoLances[i+1] : '';
        linha.appendChild(num);
        linha.appendChild(lanceB);
        linha.appendChild(lanceP);
        divHistorico.appendChild(linha);
    }
    // Rolagem automática para acompanhar o fim da lista
    // divHistorico.scrollTop = divHistorico.scrollHeight;
}
// Inicialização da aplicação
inicializarPecasQuanticas();
renderizarTabuleiro();
// ### O que essa versão traz de novo:
// 1. **Sistema Completo de Drag and Drop:** Você pode clicar com o mouse, segurar e arrastar a peça diretamente para a casa alvo. O tabuleiro destaca visualmente a casa sobre a qual a peça está passando (`drag-over`).
// 2. **Painel com Notação Oficial de Xadrez:** O painel direito gera automaticamente strings em notação algébrica padrão (como `Nf3`, `e4`, `Bxb7`) alimentadas pelas regras do `chess.js` em tempo real.
// 3. **Alternativa Híbrida de Controle:** Se preferir não arrastar, o sistema **continua aceitando o clique padrão**: clique na peça de origem (ela fica amarela) e clique na casa de destino para movê-la.
    </script>
</body>
</html>
